<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masai Investors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 5px 20px 5px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            width: 22%;
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            box-sizing: border-box;
            border-radius: 5px;
            box-shadow: 0 3px 2px rgba(0, 0, 0, 0.2);
        }

        .card .photo {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }


        .card h3 {
            margin: 10px 0 5px;
            font-size: 18px;
        }

        .card p {
            margin: 0 0 10px;
            color: #777;
            font-size: 16px;
        }


        .logo {
            width: 120px;
            height: auto;
        }

        @media (max-width: 900px) {
            .card {
                width: 45%;
            }
        }

        @media (max-width: 600px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h2>Masai Investors</h2>

    <div class="container">

        <div class="card">
            <img class="photo" src="https://cdn.masaischool.com/masai-website/Vijay_Shekhar_Sharma_Paytm_96f52579b8.jpg"
                alt="Vijay Shekhar Sharma image">
            <h3>Vijay Shekhar Sharma</h3>
            <p>Founder & CEO</p>
            <img class="logo" src="https://cdn.masaischool.com/masai-website/paytm_rect_06df45a24f.svg" alt="Paytm img">
        </div>

        <div class="card">
            <img class="photo" src="https://cdn.masaischool.com/masai-website/Rectangle_427_637d69bb57.png"
                alt="Kunal Shah image">
            <h3>Kunal Shah</h3>
            <p>Founder</p>
            <img class="logo" src="https://cdn.masaischool.com/masai-website/cred_0a47d7b4f8.png" alt="Cred img">
        </div>

        <div class="card">
            <img class="photo" src="https://cdn.masaischool.com/masai-website/amrish_rau_pine_labs_144e5e587c.jpg"
                alt="Amrish Rau image">
            <h3>Amrish Rau</h3>
            <p>CEO</p>
            <img class="logo" src="https://cdn.masaischool.com/masai-website/pine_labs_0aa2407434.png"
                alt="Pine Labs img">
        </div>

        <div class="card">
            <img class="photo" src="https://cdn.masaischool.com/masai-website/Sampad_swain_Instamojo_f12bf6341e.jpg"
                alt="Sampad Swain image">
            <h3>Sampad Swain</h3>
            <p>Co-Founder & CEO</p>
            <img class="logo" src="https://cdn.masaischool.com/masai-website/instamojo_8763e704f7.png"
                alt="Instamojo img">
        </div>

        <div class="card">
            <img class="photo" src="https://cdn.masaischool.com/masai-website/Ankush_Sachdeva_Sharechat_4e44dbbe6b.jpg"
                alt="Ankush Sachdeva image">
            <h3>Ankush Sachdeva</h3>
            <p>Co-Founder & CEO</p>
            <img class="logo" src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg"
                alt="ShareChat img">
        </div>

        <div class="card">
            <img class="photo"
                src="https://cdn.masaischool.com/masai-website/bhanu_pratap_singh_sharechat_11fdd7b47a.jpg"
                alt="Bhanu Pratap Singh image">
            <h3>Bhanu Pratap Singh</h3>
            <p>Co-Founder & CTO</p>
            <img class="logo" src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg"
                alt="ShareChat img">
        </div>

        <div class="card">
            <img class="photo" src="https://cdn.masaischool.com/masai-website/farid_ahsan_sharechat_1251f28141.png"
                alt="Farid Ahsan image">
            <h3>Farid Ahsan</h3>
            <p>Co-Founder & COO</p>
            <img class="logo" src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg"
                alt="ShareChat img">
        </div>

        <div class="card">
            <img class="photo"
                src="https://cdn.masaischool.com/masai-website/Amit_Kumar_Agarwal_Nobroker_a8a279ad91.jpg"
                alt="Amit Kumar Agarwal image">
            <h3>Amit Kumar Agarwal</h3>
            <p>Founder & CEO</p>
            <img class="logo" src="https://cdn.masaischool.com/masai-website/nobroker_rect_28c9778c30.svg"
                alt="NoBroker img">
        </div>

    </div>

</body>

</html>
