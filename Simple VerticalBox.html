<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical Box Model</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }

        .outer-box {
            width: 350px;
            margin: 40px auto;
            padding: 20px 45px;
            background-color: #d6c4ec;
            border-radius: 20px;
            text-align: center;
        }

        .card {
            background-color: white;
            width: 90%;
            margin: 30px auto;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-bottom: 10px;
            font-size: 42px;
            color: #3d1f82;
            font-style: italic;
        }

        .card p {
            color: grey;
            font-weight: bold;
            font-size: 26px;
        }

        .number {
            font-size: 42px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="outer-box">
        <h2>Highest & Average CTC</h2>

        <div class="card">
            <p>Expected Increase in Salary Potential</p>
            <div class="number">60%</div>
        </div>

        <div class="card">
            <p>Average CTC</p>
            <div class="number">₹6.1 LPA</div>
        </div>

        <div class="card">
            <p>Highest CTC</p>
            <div class="number">₹36 LPA</div>
        </div>
    </div>

</body>

</html>
