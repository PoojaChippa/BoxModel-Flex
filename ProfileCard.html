<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .card {
            width: 300px;
            height: 420px;
            padding: 20px;
            margin: auto;
            margin-top: 50px;

            border: 2px solid black;
            border-radius: 12px;

            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);

            text-align: center;
            background-color: white;
        }

        .profile-img {
            width: 150px;
            height: 150px;

            border-radius: 50%;
            object-fit: cover;

            display: block;
            margin: 0 auto;
        }

        .tagline {
            font-size: 14px;
            color: #555;
            margin-top: -10px;
            margin-bottom: 12px;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            margin-top: 10px;

            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="images/profie image.jpg" alt="profile" class="profile-img">

        <h2>Pooja Chippa</h2>
        <p class="tagline">Frontend Developer | Creative Designer | AI Explorer by curiosity.</p>

        <p>A passionate web developer and Artificial Intelligent, who loves creating beautiful UI designs and wrok on
            new AI models .</p>

        <a href="#" class="btn">View Profile</a>
    </div>

</body>

</html>
